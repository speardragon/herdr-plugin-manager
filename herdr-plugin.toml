id = "ray.plugin-manager"
name = "Plugin Manager"
version = "0.6.0"
min_herdr_version = "0.7.4"
description = "Manage herdr plugins from a popup: list, install, update, enable/disable, uninstall, browse the marketplace, open repo in browser, edit plugins.json"
platforms = ["macos", "linux", "windows"]

[[panes]]
id = "manager"
platforms = ["macos", "linux"]
title = "Plugin Manager"
placement = "popup"
width = 82
height = 28
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/bin/manager.sh\""]

[[actions]]
id = "open"
platforms = ["macos", "linux"]
title = "Open plugin manager"
contexts = ["workspace"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin ray.plugin-manager --entrypoint manager --placement popup --focus"]

[[panes]]
id = "manager-windows"
platforms = ["windows"]
title = "Plugin Manager"
placement = "popup"
width = 82
height = 28
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/bin/windows.ps1\" manager"]

[[actions]]
id = "open-windows"
platforms = ["windows"]
title = "Open plugin manager (Windows)"
contexts = ["workspace"]
command = ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/bin/windows.ps1\" open"]
